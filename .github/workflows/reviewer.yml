# The Actions reviewer as a reconciler on main (#255 stage 1, GOV-0020): on a schedule or a
# dispatch, `plan` reads repo state and lists the open PRs needing a review now, then one
# `review` job runs per listed PR. Every run starts from main, so GOV-0018's main-only
# environment accepts it. GOV-0020 amends GOV-0017 (trusted authors, forks and drafts are
# now plan's policy) and GOV-0019's events (pull_request no longer starts a review; an
# early nudge is #261). Concurrency and the skip rule: GOV-0019, #258. Reviewer App key and
# token scopes: GOV-0018. Job log: GOV-0016. Model credential: the owner's direction on
# #208 (a subscription token for now; an API key is the goal).
# Committed by the owner: the Apps have no `workflows` permission (#32).
name: Reviewer

on:
  schedule:
    # GOV-0010's interval. GitHub may start scheduled runs late, or skip one under load;
    # the next sweep picks up whatever was missed.
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      pr:
        description: PR number to review (leave empty to sweep every open PR)
        required: false
        type: string

permissions: {}

jobs:
  plan:
    # No secrets, no environment. Decides which PRs to review now (GOV-0020, #257, #258).
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: reviewer-plan
      cancel-in-progress: false
    permissions:
      contents: read        # checkout, and head commit dates (#258)
      pull-requests: read   # open PRs and their reviews
      actions: read         # this workflow's earlier runs and jobs (#258)
    outputs:
      prs: ${{ steps.plan.outputs.prs }}
      any: ${{ steps.plan.outputs.any }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          PR_INPUT: ${{ inputs.pr }}
        run: |
          set -euo pipefail
          pr="${PR_INPUT#\#}"
          if [ -z "$pr" ]; then
            python3 launcher/actions_review.py plan
          elif [[ "$pr" =~ ^[0-9]+$ ]]; then
            python3 launcher/actions_review.py plan --pr "$pr"
          else
            echo "plan: the pr input must be a PR number"
            echo "prs=[]" >> "$GITHUB_OUTPUT"
            echo "any=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

  review:
    needs: plan
    if: needs.plan.outputs.any == 'true'
    # plan finds earlier attempts by this exact name (REVIEW_JOB in actions_review.py, #258).
    name: "review #${{ matrix.pr }} ${{ matrix.head }}"
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.prs) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: reviewer
    concurrency:
      group: reviewer-pr-${{ matrix.pr }}
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      # Main, never the PR head: run writes its hooks into this checkout and runs them with
      # the secrets, so no code from the PR may run here (#240). The reviewer reads the PR
      # through gh.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.317
      - name: Review
        env:
          APP_ID: ${{ secrets.REVIEWER_APP_ID }}
          APP_KEY: ${{ secrets.REVIEWER_APP_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          PR: ${{ matrix.pr }}
        run: |
          set -euo pipefail
          echo "::add-mask::$CLAUDE_CODE_OAUTH_TOKEN"
          # Mint the reviewer App token as ops/swarm-token does (GOV-0018's stdlib option:
          # openssl, curl and jq on the runner, no third-party action), limited to this repo
          # and to pull_requests: write, contents: read, issues: read.
          key="$RUNNER_TEMP/reviewer.pem"
          (umask 077; printf '%s\n' "$APP_KEY" > "$key")
          unset APP_KEY
          b64url() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }
          now=$(date +%s)
          header=$(printf '{"alg":"RS256","typ":"JWT"}' | b64url)
          payload=$(printf '{"iat":%d,"exp":%d,"iss":"%s"}' $((now - 60)) $((now + 540)) "$APP_ID" | b64url)
          sig=$(printf '%s.%s' "$header" "$payload" | openssl dgst -sha256 -sign "$key" -binary | b64url)
          rm -f "$key"
          jwt="$header.$payload.$sig"
          echo "::add-mask::$jwt"
          api() { curl -fsS -H "Authorization: Bearer $jwt" -H "Accept: application/vnd.github+json" "$@"; }
          inst=$(api "https://api.github.com/repos/$GITHUB_REPOSITORY/installation" | jq -r .id)
          GH_TOKEN=$(api -X POST "https://api.github.com/app/installations/$inst/access_tokens" \
            -d "{\"repositories\":[\"${GITHUB_REPOSITORY#*/}\"],\"permissions\":{\"pull_requests\":\"write\",\"contents\":\"read\",\"issues\":\"read\"}}" \
            | jq -r .token)
          echo "::add-mask::$GH_TOKEN"
          unset jwt
          export GH_TOKEN
          # Prints only result, subtype, num_turns and total_cost_usd (GOV-0016).
          # Exit 0 done, 3 at budget or turn ceiling, 1 error, 2 refused.
          python3 launcher/actions_review.py run --pr "$PR"
