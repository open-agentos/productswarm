# Swarm manifest: which sessions `swarm up` starts (v1 launcher, GOV-0005).
# Format and location per the owner's answer on #44: TOML, read with stdlib tomllib.
#
# One [[session]] table per role:
#   role           required  a role with a prompt in roles/<role>.md
#   count          required  how many sessions of this role, at least 1
#   model          required  the Claude model ID the sessions run on
#   spend_cap_usd  optional  per-session spend cap in USD; no cap if left out (#45).
#                            Warn-only: the launcher never stops a session (GOV-0008).
#
# Any other key is an error. Changing a role's model changes cost per run: that is a
# `spend` decision for the owner.

# Limits on the sessions `swarm watch` starts (v2, #90), per GOV-0010 (#88)
# (option 1). Sessions you start with `swarm up` or `swarm launch` don't count.
#   interval_minutes  how often swarm watch reads GitHub and heartbeat state
#   max_live          the most live sessions swarm watch may have started at once
# swarm watch also starts only roles that set spend_cap_usd below, and lists any other
# trigger as skipped in `swarm inbox`. Changing any of this is a `spend` decision.
[watch]
interval_minutes = 5
max_live = 2

[[session]]
role = "planner"
count = 1
model = "claude-opus-5-5"

[[session]]
role = "builder"
count = 1
model = "claude-opus-5-5"

# The reviewer runs by default (L6): each session reviews every open, non-draft PR
# once per push, then stops. Its loop is in roles/reviewer.md.
[[session]]
role = "reviewer"
count = 1
model = "claude-opus-5-5"

[[session]]
role = "docs"
count = 1
model = "claude-opus-5-5"
