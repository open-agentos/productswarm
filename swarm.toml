# Swarm manifest: which sessions `swarm up` starts (v1 launcher, GOV-0005).
# Format and location per the owner's answer on #44: TOML, read with stdlib tomllib.
#
# One [[session]] table per role:
#   role           required  a role with a prompt in roles/<role>.md
#   count          required  how many sessions of this role, at least 1
#   model          required  the Claude model ID the sessions run on
#   spend_cap_usd  optional  per-session spend cap in USD; no cap if left out (#45).
#                            Warn-only: the launcher never stops a session (GOV-0008).
#
# Any other key is an error. Changing a role's model changes cost per run: that is a
# `spend` decision for the owner.

# Limits on the sessions `swarm watch` starts (v2, #90), per GOV-0010 (#88)
# (option 1). Sessions you start with `swarm up` or `swarm launch` don't count.
#   interval_minutes  how often swarm watch reads GitHub and heartbeat state
#   max_live          the most live sessions swarm watch may have started at once
#   max_turns         the turn ceiling for each headless run swarm watch starts (#147,
#                     GOV-0012): Claude Code ends a run at it, or at the role's
#                     spend_cap_usd (--max-budget-usd), whichever comes first. The budget is
#                     the main bound; this only catches a run that is looping. Required for
#                     swarm watch to start anything. 200 is the planner's suggested value:
#                     the owner sets it.
# swarm watch also starts only roles that set spend_cap_usd below, and lists any other
# trigger as skipped in `swarm inbox`. Changing any of this is a `spend` decision.
#
#   review_in_actions optional, true or false, default false (#216, GOV-0019). When true,
#                     swarm watch leaves every [review] trigger to the GitHub Actions
#                     reviewer workflow and starts nothing for it; [respond], [build],
#                     [answer] and [record] still run locally, and `swarm inbox` says it is
#                     on. Set it back to false (and disable the workflow if Actions should
#                     stop reviewing) to fall back to local reviews. Changing it is a
#                     `ci-and-workflows` call for the owner, not a `spend` one.
#
#   actions_max_reviews optional, a whole number of at least 1 (#257, #255). The most open
#                     PRs one `actions_review.py plan` sweep lists for the Actions reviewer,
#                     oldest first; the rest wait for the next sweep. Left out, plan lists
#                     nothing. 2 (today's max_live) is the builder's suggested value: the
#                     owner sets it. Changing it is a `spend` decision.
#
#   daily             optional, true or false, default false (#588, GOV-0029). When true,
#                     swarm watch starts the planner on report_issue once each working day
#                     (Mon-Fri, local time) at or after daily_at, to write the daily report,
#                     and on Mondays the check-in too. Needs both settings below. Turning it
#                     on is a `spend` decision for the owner.
#   daily_at          local time it is due, "HH:MM" (24-hour), e.g. "08:30"
#   report_issue      the pinned report issue's number
# daily = true
# daily_at = "08:30"
# report_issue = <the pinned report issue>
[watch]
interval_minutes = 5
max_live = 4
max_turns = 200
review_in_actions = false
actions_max_reviews = 2
report_issue = 249
daily = true
daily_at = "08:30"
asks = true
research = true
call_ins = true

[merger] 
mode = "live"
max_changed_lines = 500

# The specs bridge's source (#952, #1007): `swarm specs pull / diff / push` read and write
# it. The Notion token is never here: NotionSource reads it from
# ~/.config/productswarm/notion.token (mode 0600) at call time (GOV-0043).
#   backend      "notion", "fake" or "productboard"
#   parent_page  the Notion page the integration is shared with
#   fixture      the fake backend's state file; unused by notion
[specs]
backend = "notion"
parent_page = "416ec22e-b1e3-8129-8868-d1d23514d60e"   # "productswarm specs"

# The classifier engine (#1010): `swarm classify eval` reads this. Per GOV-0045 its model
# calls run on this Mac through the Claude Code login (`claude -p`), with no new key.
#   model            the model a classifier run uses unless --model names another;
#                    Haiku-class unless an eval shows it fails the pass mark (GOV-0045)
#   eval_budget_usd  one live eval run's budget: each call gets what is left of it as
#                    --max-budget-usd, and the run stops when it is spent (GOV-0045).
#                    The label set's max_calls caps the same run's calls.
[classify]
model = "claude-haiku-5-5"
eval_budget_usd = 5

[[session]]
role = "planner"
count = 1
model = "claude-opus-5-5"
spend_cap_usd = 5

[[session]]
role = "builder"
count = 1
model = "claude-opus-5-5"
spend_cap_usd = 15

# The reviewer runs by default (L6): each session reviews every open, non-draft PR
# once per push, then stops. Its loop is in roles/reviewer.md.
[[session]]
role = "reviewer"
count = 1
model = "claude-opus-5-5"
spend_cap_usd = 5

[[session]]
role = "docs"
count = 1
model = "claude-sonnet-5-5"
spend_cap_usd = 5

[[session]]
role = "designer"
count = 1
model = "claude-opus-5-5"
spend_cap_usd = 5

[[session]]
role = "analyst"
count = 1
model = "claude-sonnet-5-5"
spend_cap_usd = 5

[org]
repos = ["open-agentos/productswarm-scratch"]
